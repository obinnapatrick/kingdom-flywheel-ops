name: Companies House acquisition universe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "acquisition-os/**"
      - ".github/workflows/companies-house-universe.yml"
  pull_request:
    paths:
      - "acquisition-os/**"
      - ".github/workflows/companies-house-universe.yml"

permissions:
  contents: read
  id-token: write

jobs:
  build-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Request short-lived GitHub OIDC token
        shell: bash
        run: |
          RESPONSE="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=acq-os-supabase")"
          echo "::add-mask::$(echo "$RESPONSE" | jq -r .value)"
          echo "OIDC_TOKEN=$(echo "$RESPONSE" | jq -r .value)" >> "$GITHUB_ENV"
      - name: Stream-filter and ingest latest Companies House snapshot
        env:
          INGEST_URL: "https://nydyipplixpytqfpoomc.supabase.co/functions/v1/ch-universe-ingest"
        run: python acquisition-os/build_company_universe.py
      - name: Show summary
        run: cat out/summary.json
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: companies-house-acquisition-universe
          path: |
            out/companies_house_candidates_*.csv
            out/summary.json
          compression-level: 6
          retention-days: 7
